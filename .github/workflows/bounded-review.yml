name: Bounded review
on: [pull_request]
permissions: { contents: read }
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/check-change-size.mjs "$CHANGE_BASE" "$CHANGE_HEAD"
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha }}
      - run: npm ci
      - run: npm run lint
      - run: node --test tests/json-lines.test.mjs tests/audit-record-consistency.test.mjs
