name: Bounded review
on: [pull_request]
permissions: { contents: read }
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/check-change-size.mjs "$CHANGE_BASE" "$CHANGE_HEAD"
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha }}
      - run: npm ci && npm run lint && npx --no-install eslint scripts tests
      - name: Check design scope revisions
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readJsonLines} from './scripts/json-lines.mjs';
          const current=new Map((await readJsonLines('docs/agents/design-gaps.jsonl')).map(record=>[record.recordIdentifier,record]));
          for(const record of current.values())
            for(const file of record.scopeFiles??[]) execFileSync('git',['cat-file','-e',`${record.baselineCommit}:${file}`]);
          NODE
      - name: Inspect duplicated parsing
        run: |
          npx --yes --package @ast-grep/cli@0.45.3 ast-grep test --skip-snapshot-tests
          npx --yes --package @ast-grep/cli@0.45.3 ast-grep scan --json=stream scripts tests
      - run: node scripts/connect-planetarium.mjs
      - run: node --test --test-name-pattern='code gates|framework links|Plumeria' tests/application.test.mjs
      - run: node --test tests/json-lines.test.mjs tests/iso-timestamp.test.mjs tests/audit-record-consistency.test.mjs tests/exploration.test.mjs tests/review-verification.test.mjs tests/contract.test.mjs tests/browser-observations.test.mjs
